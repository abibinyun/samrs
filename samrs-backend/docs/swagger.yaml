openapi: 3.0.3
info:
  title: SAMRS API
  version: "1.0.0"
  description: Sistem Manajemen Aset Rumah Sakit (MVP)
servers:
  - url: http://localhost:8090
    description: Local (Docker)
  - url: http://localhost:8080
    description: Local (without Docker)
security:
  - bearerAuth: []
paths:
  /ping:
    get:
      summary: Public ping
      tags: [Health]
      security: []
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
  /api/v1/auth/login:
    post:
      summary: Login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
  /api/v1/auth/me:
    get:
      summary: Get current user + permissions
      tags: [Auth]
      responses:
        "200":
          description: Data user ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"
  /api/v1/secure-ping:
    get:
      summary: Secure ping (requires auth)
      tags: [Health]
      responses:
        "200":
          description: Secure pong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIResponse"

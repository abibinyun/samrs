components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    per_page:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
    sort_by:
      name: sort_by
      in: query
      schema:
        type: string
    sort_dir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum: [asc, desc]
    search:
      name: search
      in: query
      schema:
        type: string
    date_from:
      name: date_from
      in: query
      schema:
        type: string
        format: date
    date_to:
      name: date_to
      in: query
      schema:
        type: string
        format: date
  schemas:
    APIResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
    APIResponseWithMeta:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          nullable: true
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    RoomCreate:
      type: object
      required: [name, code]
      properties:
        name:
          type: string
        code:
          type: string
        location:
          type: string
    BedCreate:
      type: object
      required: [room_id, code]
      properties:
        room_id:
          type: string
        code:
          type: string
    BedUpdate:
      type: object
      required: [room_id, code]
      properties:
        room_id:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [available, occupied, maintenance]
    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    AssetCreate:
      type: object
      required: [category_id, code, name]
      properties:
        category_id:
          type: integer
        room_id:
          type: string
        bed_id:
          type: integer
        vendor_id:
          type: integer
        brand_id:
          type: integer
        model_id:
          type: integer
        code:
          type: string
        name:
          type: string
        brand:
          type: string
        model:
          type: string
        status:
          type: string
        purchase_date:
          type: string
          format: date
    DocumentUpload:
      type: object
      required: [title, files]
      properties:
        title:
          type: string
        doc_type:
          type: string
          enum: [sop, manual, certificate, other]
        description:
          type: string
        files:
          type: array
          items:
            type: string
            format: binary
    DocumentFileUpload:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: string
            format: binary
    DocumentUpdate:
      type: object
      properties:
        title:
          type: string
        doc_type:
          type: string
          enum: [sop, manual, certificate, other]
        description:
          type: string
    AssetEvent:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        asset_id:
          type: string
        user_id:
          type: string
        event_type:
          type: string
        description:
          type: string
        meta:
          type: object
        created_at:
          type: string
          format: date-time
    MaintenanceScheduleCreate:
      type: object

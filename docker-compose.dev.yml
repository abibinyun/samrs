version: '3.8'

services:
  # Override frontend untuk development dengan hot reload
  frontend:
    build:
      context: ./samrs-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./samrs-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000

